[package]
name = "mandrill-sender"
version = "0.3.0"
edition = "2024"
publish = false

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "accesskit"] }
email_address = "0.2"
mime_guess = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls"] }
rfd = { version = "0.15", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[profile.release]
opt-level = "s"
strip = true
